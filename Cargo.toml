[workspace]
resolver = "2"
members = ["crates/gitsot-core", "crates/gitsot-app", "crates/gitsot"]
default-members = ["crates/gitsot-core", "crates/gitsot-app", "crates/gitsot"]

[workspace.package]
version = "0.3.7"
edition = "2021"
publish = false

[workspace.dependencies]
gitsot-core = { path = "crates/gitsot-core" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
git2 = { version = "0.21", default-features = false }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
alacritty_terminal = "0.26"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
