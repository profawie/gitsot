[workspace]
resolver = "2"
members = [
    "crates/gitsot-shared",
    "crates/gitsot-core",
    "crates/gitsot-term",
    "crates/gitsot-forge",
    "crates/gitsot-app",
    "crates/gitsot",
]
default-members = [
    "crates/gitsot-shared",
    "crates/gitsot-core",
    "crates/gitsot-term",
    "crates/gitsot-forge",
    "crates/gitsot-app",
    "crates/gitsot",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
publish = false

[workspace.dependencies]
gitsot-shared = { path = "crates/gitsot-shared" }
gitsot-core = { path = "crates/gitsot-core" }
gitsot-term = { path = "crates/gitsot-term" }
gitsot-forge = { path = "crates/gitsot-forge" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
git2 = { version = "0.21", default-features = false }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
alacritty_terminal = "0.26"
libloading = "0.8"

[profile.release]
opt-level = 3
# No LTO: gitsot is split into several dynamic libraries (see
# .cargo/config.toml), and Rust cannot use LTO across them.
lto = false
strip = true
codegen-units = 4
