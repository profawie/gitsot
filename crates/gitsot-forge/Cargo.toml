[package]
name = "gitsot-forge"
description = "gitsot forge: pull requests on the Git host (no UI), built as gitsot_forge.dll"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# gitsot_forge.dll (Windows), libgitsot_forge.dylib (macOS), libgitsot_forge.so (Linux).
crate-type = ["dylib"]

[dependencies]
gitsot-shared.workspace = true
gitsot-core.workspace = true
serde.workspace = true
serde_json.workspace = true
